name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux & Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Linux & Extension
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 1.0.0)"
          fi
          echo "Packaging version: $VERSION"
          bash scripts/package-release.sh "$VERSION"

      - name: Upload Linux & Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/TabCircle-Extension.zip
            release/tabcircle-linux.tar.gz

  build-macos:
    name: Build macOS DMGs
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Build macOS App & DMGs
        run: |
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo 1.0.0)"
          fi
          echo "Building version: $VERSION"
          bash scripts/build-app.sh "$VERSION"

      - name: Upload macOS DMGs
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: build/TabCircle-*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Unified Checksums
        run: |
          cd release-assets
          echo "--> Downloaded release assets:"
          ls -lh
          # Verify expected assets exist before hashing
          for f in TabCircle-Extension.zip tabcircle-linux.tar.gz; do
            if [ ! -f "$f" ]; then
              echo "Error: Missing required artifact $f" >&2
              exit 1
            fi
          done
          sha256sum TabCircle-Extension.zip tabcircle-linux.tar.gz TabCircle-*.dmg > checksums.txt
          echo "--> Generated checksums:"
          cat checksums.txt

      - name: Generate Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat << EOF > release-notes.md
          ## What's New

          - **Automated macOS DMG Packaging**: Built on \`macos-14\` (Apple Silicon) runners, providing native \`arm64\` and \`x86_64\` disk images.
          - **Linux Helper Auto-Update**: Background update check against GitHub Releases (\`./scripts/install-linux.sh --check-updates\`) with \`notify-send\` desktop alerts.
          - **Wayland Compatibility Detection**: Clear diagnostics and actionable guidance (\`--ozone-platform=x11\`) for browsers running under Wayland.
          - **Unified 5-Asset Distribution**: Extension, Linux daemon, Apple Silicon DMG, Intel DMG, and unified SHA-256 checksums in every release.
          - **Browser Extension Updated**: Manifest bumped to v\${VERSION}. Reload unpacked from \`chrome://extensions\` after downloading.

          ### System Requirements
          - **Linux**: Python 3.9+, X11 session (Cinnamon, GNOME on Xorg, KDE, XFCE, MATE), Chromium-based browser (Chrome, Brave, Edge) 116+.
          - **macOS**: macOS 14+ (Sonoma, Sequoia), Chromium-based browser 116+.

          ### Download

          | File | Operating System | Architecture / Notes |
          |---|---|---|
          | **\`TabCircle-\${VERSION}-arm64.dmg\`** | macOS | Apple Silicon (M1/M2/M3/M4) |
          | **\`TabCircle-\${VERSION}-x86_64.dmg\`** | macOS | Intel |
          | **\`tabcircle-linux.tar.gz\`** | Linux (X11) | Helper daemon + \`install-linux.sh\` |
          | **\`TabCircle-Extension.zip\`** | Linux & macOS | Browser extension (unzip and load in \`chrome://extensions\`) |
          | **\`checksums.txt\`** | All | SHA-256 verification hashes |

          > [!NOTE]
          > **macOS First Launch:** Because these builds are ad-hoc signed, right-click \`TabCircle.app\` → **Open** on first launch to bypass Gatekeeper (or run \`xattr -d com.apple.quarantine /Applications/TabCircle.app\`).
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            release-assets/TabCircle-Extension.zip
            release-assets/tabcircle-linux.tar.gz
            release-assets/TabCircle-*.dmg
            release-assets/checksums.txt
          generate_release_notes: true
