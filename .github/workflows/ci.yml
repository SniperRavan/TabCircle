name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension-tests:
    name: Extension tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - run: node extension/tests/closed-tabs.test.js
      - run: node extension/tests/lifetime-sweep.test.js

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.11'
      - run: python3 -m py_compile linux-helper/app.py linux-helper/update_checker.py

  python-tests:
    name: Python unit tests (Qt offscreen)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.3.0
        with:
          python-version: '3.11'
      - name: Install system Qt/X11 deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1
      - run: pip install -r linux-helper/requirements.txt
      - run: python3 tests/test_multimonitor.py
      - run: python3 tests/test_config.py

  shell-lint:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Syntax check
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bf48f761362da # v2.0.0
        with:
          scandir: './scripts'
          severity: warning
